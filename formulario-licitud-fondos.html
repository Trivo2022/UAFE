<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licitud de Fondos y Registro de Pagos – NETBROKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Formulario de una columna con secciones numeradas; barra de acciones fija al pie */
  --teal:#00697A; --teal-2:#009A90; --tint:#E6F3F4; --ink:#17323A; --muted:#5B7279;
  --line:#C9DADD; --bg:#F4F8F8; --card:#FFFFFF; --warn:#B4442F; --ok:#1F7A4D;
  --font-display:"Nunito Sans", "Segoe UI", Arial, sans-serif;
  --font-body:"Nunito Sans", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --teal:#4FC3C9; --teal-2:#3CC6B6; --tint:#123A40; --ink:#E4F1F2; --muted:#9DB8BC;
    --line:#2C4D53; --bg:#0D1F23; --card:#132C31; --warn:#F08A72; --ok:#6BD3A0; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --teal:#4FC3C9; --teal-2:#3CC6B6; --tint:#123A40; --ink:#E4F1F2; --muted:#9DB8BC;
  --line:#2C4D53; --bg:#0D1F23; --card:#132C31; --warn:#F08A72; --ok:#6BD3A0; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-bottom:96px}
header.top{background:var(--card);border-bottom:4px solid var(--teal-2)}
.wrap{max-width:920px;margin:0 auto;padding:0 18px}
.brand{display:flex;gap:14px;align-items:center;padding:16px 0}
.brand img{width:44px;height:auto}
.brand h1{font-family:var(--font-display);font-size:1.35rem;margin:0;color:var(--teal);text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.intro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:18px 0;display:grid;gap:6px}
.intro b{color:var(--teal)}
.intro ol{margin:4px 0 0 18px;padding:0}
.tipo{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.tipo label{flex:1 1 220px;display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:700}
.tipo input{accent-color:var(--teal);width:18px;height:18px}
.tipo label:has(input:checked){border-color:var(--teal);background:var(--tint)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 16px;overflow:hidden}
section.card>h2{margin:0;font-family:var(--font-display);font-size:1rem;background:var(--teal);color:#fff;padding:9px 16px;display:flex;gap:10px;align-items:baseline}
section.card>h2 .n{opacity:.8;font-variant-numeric:tabular-nums}
.body{padding:14px 16px;display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 3}
.f.s2{grid-column:span 2}.f.s6{grid-column:span 6}.f.s4{grid-column:span 4}
.f label{font-size:.8rem;font-weight:700;color:var(--muted)}
.req{color:var(--warn)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{
  font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
input[readonly]{background:var(--tint);font-weight:700}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--teal) 45%,transparent);outline-offset:1px;border-color:var(--teal)}
.invalid{border-color:var(--warn)!important;background:color-mix(in srgb,var(--warn) 8%,var(--bg))!important}
.hint{font-size:.78rem;color:var(--muted)}
.radios{display:flex;flex-wrap:wrap;gap:8px 16px;padding:2px 0;border-radius:7px;border:1px solid transparent}
.radios label{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--ink);font-size:.9rem}
.radios input{accent-color:var(--teal)}
.sub{font-weight:800;color:var(--teal);font-size:.88rem;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:4px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:var(--tint);color:var(--teal);text-align:left;padding:6px 8px;font-size:.78rem;min-width:110px}
td{padding:4px;border-bottom:1px solid var(--line)}
td input{padding:6px 8px}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;border:2px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.decl{display:grid;gap:10px}
.decl label{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.decl input{accent-color:var(--teal);width:18px;height:18px;flex:0 0 auto;margin-top:2px}
ul.docs{margin:0;padding-left:20px;display:grid;gap:3px;font-size:.9rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px}
.bar .msg{flex:1 1 260px;font-size:.86rem;color:var(--muted)}
.bar .msg.err{color:var(--warn);font-weight:700}.bar .msg.ok{color:var(--ok);font-weight:700}
.privacy{font-size:.8rem;color:var(--muted);margin:6px 0 24px}
[hidden]{display:none!important}
@media (max-width:640px){.grid{grid-template-columns:1fr 1fr}.f,.f.s2,.f.s4,.f.s6{grid-column:span 2}}
@media print{.bar,.tipo{display:none}body{padding:0;background:#fff}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('h1').textContent = CFG.h1;
document.getElementById('subt').textContent = CFG.subtitle;
document.getElementById('intro').innerHTML = `<div>${esc(CFG.intro)}</div><div><b>Cómo completarlo:</b></div><ol>
  <li>${CFG.tipos.length > 1 ? 'Elija el tipo de persona y llene' : 'Llene'} todos los campos marcados con <span class="req">*</span>. Si un dato no aplica, escriba N/A.</li>
  <li>Acepte las declaraciones y pulse <b>Descargar PDF para firmar</b>.</li>
  <li>Imprima el PDF, fírmelo a mano o con firma electrónica (FirmaEC) y entréguelo junto con los documentos que se listan al final.</li></ol>`;
const tiposBox = document.getElementById('tipos');
if (CFG.tipos.length > 1) {
  tiposBox.innerHTML = CFG.tipos.map((t,i) => `<label><input type="radio" name="tipoPersona" id="tp_${t.v}" value="${t.v}" ${i===0?'checked':''}> ${esc(t.label)}</label>`).join('');
} else tiposBox.hidden = true;

const frm = document.getElementById('frm');
const ALLF = [], TABLES = {};
function depAttr(o){ return o.dep ? ` data-dep='${esc(JSON.stringify(o.dep))}'` : ''; }
function fieldHTML(f){
  const req = f.r ? ' <span class="req">*</span>' : (f.rd ? ' <span class="req">*</span>' : '');
  const attrs = `class="f s${f.s || 3}"${f.who ? ` data-who="${f.who}"` : ''}${depAttr(f)} data-field="${f.id}"`;
  if (f.t === 'radio') {
    return `<div ${attrs}><label>${esc(f.l)}${req}</label><div class="radios" role="radiogroup" aria-label="${esc(f.l)}">` +
      f.o.map((o,i)=>`<label><input type="radio" name="${f.id}" id="${f.id}_${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('') + `</div></div>`;
  }
  let ctrl;
  if (f.t === 'select') ctrl = `<select id="${f.id}"><option value="">Seleccione…</option>${f.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  else if (f.t === 'area') ctrl = `<textarea id="${f.id}" placeholder="${esc(f.ph||'')}"></textarea>`;
  else ctrl = `<input id="${f.id}" type="${f.t}" ${f.t==='number'?'step="0.01" min="0" inputmode="decimal"':''} ${f.ro?'readonly tabindex="-1"':''} placeholder="${esc(f.ph||'')}" ${f.def?`value="${esc(f.def)}"`:''}>`;
  return `<div ${attrs}><label for="${f.id}">${esc(f.l)}${req}</label>${ctrl}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
}
function rowHTML(t, r){ return '<tr>' + t.cols.map((c,i)=>`<td><input type="text" id="${t.id}_${r}_${i}" aria-label="${esc(c)} fila ${r+1}"></td>`).join('') + '</tr>'; }
function tableHTML(t){
  TABLES[t.id] = t;
  let body = ''; for (let r=0;r<t.rows;r++) body += rowHTML(t, r);
  return `<div class="tblwrap"${t.who?` data-who="${t.who}"`:''}${depAttr(t)}>${t.title?`<div class="sub">${esc(t.title)}${t.req?' <span class="req">*</span>':''}</div>`:''}
    <div class="tbl"><table data-table="${t.id}"><thead><tr>${t.cols.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    <div style="margin-top:6px"><button type="button" class="btn ghost small" data-add="${t.id}">Agregar fila</button></div></div>`;
}
let html = '';
CFG.sections.forEach(s => {
  html += `<section class="card"${s.who?` data-who="${s.who}"`:''}><h2><span class="n"></span>${esc(s.title)}</h2><div class="body">`;
  if (s.note) html += `<div class="hint">${esc(s.note)}</div>`;
  (s.blocks || []).forEach(b => {
    if (b.fields) { html += `<div class="grid">${b.fields.map(fieldHTML).join('')}</div>`; b.fields.forEach(f => ALLF.push(Object.assign({secWho:s.who}, f))); }
    if (b.sub) html += `<div class="sub"${b.who?` data-who="${b.who}"`:''}>${esc(b.sub)}</div>`;
    if (b.table) html += tableHTML(Object.assign({secWho:s.who}, b.table));
  });
  html += `</div></section>`;
});
html += `<section class="card"><h2><span class="n"></span>Declaraciones</h2><div class="body decl">${CFG.decl.map(d=>`<label${d.who?` data-who="${d.who}"`:''}><input type="checkbox" id="${d.id}"> <span>${esc(d.t)}${d.opt?' <i>(solo si aplica)</i>':''}</span></label>`).join('')}</div></section>`;
html += `<section class="card"><h2><span class="n"></span>Documentos que debe entregar con el formulario firmado</h2><div class="body"><ul class="docs" id="docsList"></ul></div></section>`;
frm.innerHTML = html;

function tipo(){ const r = document.querySelector('input[name=tipoPersona]:checked'); return r ? r.value : CFG.tipos[0].v; }
function T(){ return CFG.tipos.find(x => x.v === tipo()); }
function val(id){
  const r = document.querySelector(`input[name="${id}"]:checked`); if (r) return r.value;
  if (document.querySelector(`input[name="${id}"]`)) return '';
  const el = document.getElementById(id); return el ? el.value.trim() : '';
}
function depOk(dep){ if (!dep) return true; return [].concat(dep).some(d => [].concat(d.v).includes(val(d.f))); }
function whoOk(w){ return !w || w === tipo(); }
function visible(o){ return whoOk(o.who) && whoOk(o.secWho) && depOk(o.dep); }
function refresh(){
  document.querySelectorAll('[data-who]').forEach(el => el.hidden = el.dataset.who !== tipo());
  document.querySelectorAll('[data-dep]').forEach(el => { if (el.dataset.who && el.dataset.who !== tipo()) return; el.hidden = !depOk(JSON.parse(el.dataset.dep)); });
  let k = 0; document.querySelectorAll('section.card').forEach(sec => { if (!sec.hidden) sec.querySelector('.n').textContent = (++k) + '.'; });
  document.getElementById('docsList').innerHTML = CFG.docs[tipo()].map(d=>`<li>${esc(d)}</li>`).join('');
}
const num = v => { const x = parseFloat(String(v).replace(/\s/g,'').replace(',', '.')); return isNaN(x) ? null : x; };
function calc(){
  (CFG.tableTotals || []).forEach(c => {
    const vals = tableData(c.table).map(r => num(r[c.col])).filter(x => x !== null);
    document.getElementById(c.target).value = vals.length ? vals.reduce((a,b)=>a+b,0).toFixed(2) : '';
  });
  (CFG.calcs || []).forEach(c => {
    const plus = (c.sum||[]).map(id => num(val(id))), minus = (c.minus||[]).map(id => num(val(id)));
    const any = plus.concat(minus).some(x => x !== null);
    const tot = plus.reduce((a,b)=>a+(b||0),0) - minus.reduce((a,b)=>a+(b||0),0);
    document.getElementById(c.target).value = any ? tot.toFixed(2) : '';
  });
}
function tableData(id){ const tb = document.querySelector(`table[data-table="${id}"] tbody`); return Array.from(tb.rows).map(tr => Array.from(tr.querySelectorAll('input')).map(i => i.value.trim())); }
tiposBox.addEventListener('change', () => { refresh(); save(); });
frm.addEventListener('input', () => { calc(); refresh(); save(); });
frm.addEventListener('change', () => { calc(); refresh(); save(); });
frm.addEventListener('click', e => {
  const id = e.target.dataset && e.target.dataset.add; if (!id) return;
  const tb = document.querySelector(`table[data-table="${id}"] tbody`); tb.insertAdjacentHTML('beforeend', rowHTML(TABLES[id], tb.rows.length));
});

// ---------------------------------------------------------------- borrador local
function snapshot(){
  const d = {tipo: tipo(), f:{}, t:{}, decl:{}};
  ALLF.forEach(f => d.f[f.id] = val(f.id));
  Object.keys(TABLES).forEach(id => d.t[id] = tableData(id));
  CFG.decl.forEach(x => d.decl[x.id] = document.getElementById(x.id).checked);
  return d;
}
function save(){ try { localStorage.setItem(CFG.key, JSON.stringify(snapshot())); } catch(e){} }
function load(){
  let d; try { d = JSON.parse(localStorage.getItem(CFG.key) || 'null'); } catch(e){ d = null; }
  if (!d) return;
  const tp = document.getElementById('tp_' + d.tipo); if (tp) tp.checked = true;
  ALLF.forEach(f => {
    const v = d.f && d.f[f.id]; if (v == null || v === '') return;
    if (f.t === 'radio') { const i = f.o.indexOf(v); if (i >= 0) document.getElementById(`${f.id}_${i}`).checked = true; }
    else { const el = document.getElementById(f.id); if (el) el.value = v; }
  });
  Object.keys(TABLES).forEach(id => {
    const rows = (d.t && d.t[id]) || [], tb = document.querySelector(`table[data-table="${id}"] tbody`);
    while (tb.rows.length < rows.length) tb.insertAdjacentHTML('beforeend', rowHTML(TABLES[id], tb.rows.length));
    rows.forEach((r, ri) => r.forEach((v, ci) => { const el = document.getElementById(`${id}_${ri}_${ci}`); if (el) el.value = v; }));
  });
  CFG.decl.forEach(x => document.getElementById(x.id).checked = !!(d.decl && d.decl[x.id]));
}

// ---------------------------------------------------------------- validación
const msg = document.getElementById('msg');
function setMsg(t, kind){ msg.textContent = t; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
function validate(){
  let first = null, missing = 0;
  const mark = el => { el.classList.add('invalid'); first = first || el; missing++; };
  document.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
  ALLF.forEach(f => {
    if (!visible(f)) return;
    if (!(f.r || f.rd)) return;
    if (!val(f.id)) mark(f.t === 'radio' ? document.querySelector(`[data-field="${f.id}"] .radios`) : document.getElementById(f.id));
  });
  Object.values(TABLES).forEach(t => {
    if (!t.req || !visible(t)) return;
    if (!tableData(t.id).some(r => r[0])) mark(document.getElementById(`${t.id}_0_0`));
  });
  CFG.decl.forEach(d => { if (!d.opt && whoOk(d.who) && !document.getElementById(d.id).checked) mark(document.getElementById(d.id).closest('label')); });
  if (first) first.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'});
  return missing;
}

// ---------------------------------------------------------------- PDF
const TEAL = [0,105,122], TINT = [215,238,239], GREY = [242,242,242];
const S = x => String(x == null ? '' : x).replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/[^\x00-\xFF]/g,'');
function buildPdf(){
  const { jsPDF } = window.jspdf;
  const tp = T(), t = tp.v;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const W = doc.internal.pageSize.getWidth(), M = 32, CW = W - 2*M;
  const fecha = new Date().toLocaleDateString('es-EC', {day:'2-digit', month:'2-digit', year:'numeric'});
  let y = 28;
  doc.addImage(LOGO, 'PNG', M, y, 30, 35);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...TEAL);
  doc.text('NETBROKER S.A.', M + 38, y + 22);
  doc.setFontSize(10.5);
  const tl = doc.splitTextToSize(S(tp.title), CW * 0.6);
  doc.text(tl, W - M, y + 12, {align:'right'});
  doc.setFont('helvetica','italic'); doc.setFontSize(7); doc.setTextColor(90);
  doc.text(S(`${tp.code} | Versión 2 | ${RES} | Llenado en línea el ${fecha}`), W - M, y + 14 + tl.length*12, {align:'right'});
  y += 48 + Math.max(0, tl.length - 2) * 12;
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(60);
  const intro = doc.splitTextToSize(S(CFG.intro + ' La información será tratada de forma confidencial.'), CW);
  doc.text(intro, M, y); y += intro.length * 8.5 + 4;
  const room = h => { if (y + h > 805) { doc.addPage(); y = 36; } };
  const bar = title => { room(40); doc.setFillColor(...TEAL); doc.rect(M, y, CW, 14, 'F'); doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(255); doc.text(S(title), M + 5, y + 10); y += 14; };
  const L = txt => ({content:S(txt), styles:{fillColor:GREY, fontStyle:'bold'}});
  const st = {font:'helvetica', fontSize:7.6, cellPadding:3, lineColor:[150,170,175], lineWidth:0.4, textColor:20, valign:'middle'};
  const pairs = list => {
    const body = []; let i = 0;
    while (i < list.length) {
      const a = list[i], b = list[i+1];
      if (a.wide || !b || b.wide) { body.push([L(a.l), {content:S(a.v), colSpan:3}]); i++; }
      else { body.push([L(a.l), S(a.v), L(b.l), S(b.v)]); i += 2; }
    }
    doc.autoTable({startY:y, margin:{left:M, right:M}, body, theme:'grid', styles:st,
      columnStyles:{0:{cellWidth:CW*0.2}, 1:{cellWidth:CW*0.3}, 2:{cellWidth:CW*0.2}, 3:{cellWidth:CW*0.3}}});
    y = doc.lastAutoTable.finalY;
  };
  const grid = (head, rows, title) => {
    if (title) { room(30); doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(...TEAL); doc.text(S(title), M, y + 10); y += 13; }
    doc.autoTable({startY:y, margin:{left:M, right:M}, head:[head.map(S)], body:(rows.length ? rows : [head.map(()=> '')]).map(r => r.map(S)), theme:'grid',
      headStyles:{fillColor:TINT, textColor:TEAL, fontStyle:'bold', fontSize:7.2}, styles:st});
    y = doc.lastAutoTable.finalY;
  };
  const para = (text, size=6.9) => {
    doc.setFont('helvetica','normal'); doc.setFontSize(size); doc.setTextColor(30);
    const lines = doc.splitTextToSize(S(text), CW - 8), h = lines.length * (size + 1.6) + 6;
    room(h); doc.setDrawColor(150,170,175); doc.setLineWidth(0.4); doc.rect(M, y, CW, h); doc.text(lines, M + 4, y + size + 2); y += h;
  };
  const signs = blocks => {
    room(90); y += 44; const cw = CW / blocks.length;
    doc.setDrawColor(0); doc.setLineWidth(0.6);
    blocks.forEach((lines, i) => {
      const x = M + i * cw;
      doc.line(x + 14, y, x + cw - 14, y);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.2); doc.setTextColor(20);
      const head = doc.splitTextToSize(S(lines[0]), cw - 20);
      doc.text(head, x + cw/2, y + 10, {align:'center'});
      doc.setFont('helvetica','normal');
      lines.slice(1).forEach((ln, j) => doc.text(S(ln), x + 18, y + 12 + head.length * 9 + j * 10));
    });
    y += 64;
  };
  let k = 0;
  CFG.sections.forEach(s => {
    if (!whoOk(s.who)) return;
    bar(`${++k}. ${s.title.toUpperCase()}`);
    (s.blocks || []).forEach(b => {
      if (b.fields) {
        const list = b.fields.filter(f => visible(Object.assign({secWho:s.who}, f))).map(f => ({l:f.l, v:val(f.id), wide: f.t==='area' || f.t==='radio' || f.l.length > 55 || f.wide}));
        if (list.length) pairs(list);
      }
      if (b.table && visible(Object.assign({secWho:s.who}, b.table))) grid(b.table.cols, tableData(b.table.id).filter(r => r.some(Boolean)), b.table.title);
      if (b.sub && whoOk(b.who)) { room(20); doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(...TEAL); doc.text(S(b.sub), M, y + 10); y += 13; }
    });
    y += 4;
  });
  bar(`${++k}. DECLARACIONES Y FIRMAS`);
  CFG.decl.filter(d => whoOk(d.who)).forEach(d => para((document.getElementById(d.id).checked ? '[X] ' : '[  ] ') + d.t));
  signs(CFG.signers(t, val, fecha));
  bar(`${++k}. DOCUMENTOS ADJUNTOS (marcar al recibir)`);
  grid(['Recibido', 'Documento'], CFG.docs[t].map(d => ['[   ]', d]));
  y += 6;
  const io = CFG.internal(t);
  bar(io.title || 'USO INTERNO – OFICIAL DE CUMPLIMIENTO');
  if (io.pre) pairs(io.pre.map(p => ({l:p[0], v:p[1], wide:true})));
  if (io.lists) grid(['Lista / fuente consultada', 'Fecha', 'Resultado (sin coincidencia / coincidencia)', 'Responsable'], io.lists.map(l => [l, '', '', '']), io.listsTitle);
  if (io.pairs) pairs(io.pairs.map(p => ({l:p[0], v:p[1], wide:true})));
  if (io.signs) signs(io.signs);
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p); doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(110);
    doc.text(S(`${tp.code} | Versión 2 | ${RES} - Página ${p} de ${pages}`), W/2, doc.internal.pageSize.getHeight() - 16, {align:'center'});
  }
  const who = S(CFG.nameFor(t, val)).replace(/[^A-Za-z0-9À-ÿ ]/g,'').replace(/\s+/g,' ').trim().slice(0,60) || 'formulario';
  return { doc, filename: `${tp.code} ${CFG.fileBase} - ${who}.pdf` };
}

// ---------------------------------------------------------------- acciones
const inClaude = typeof window.claude !== 'undefined' && window.claude && typeof window.claude.use === 'function';
let downloads = null;
if (inClaude) window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
else document.getElementById('btnPrint').hidden = false;
document.getElementById('btnPrint').addEventListener('click', () => { try { window.print(); } catch(e) {} });
document.getElementById('btnPdf').addEventListener('click', async () => {
  const missing = validate();
  if (missing) { setMsg(`Faltan ${missing} dato(s) obligatorio(s), marcados en rojo. Complételos para generar el PDF.`, 'err'); return; }
  if (!window.jspdf || !window.jspdf.jsPDF) { setMsg('No se pudo cargar el generador de PDF. Revise su conexión a internet y recargue la página.', 'err'); return; }
  const btn = document.getElementById('btnPdf'); btn.disabled = true; setMsg('Generando el PDF…');
  try {
    const { doc, filename } = buildPdf(); const blob = doc.output('blob');
    if (inClaude) {
      if (!downloads) downloads = await window.claude.use('downloads');
      if (!downloads) { setMsg('Esta vista no permite descargar archivos. Abra el formulario desde el enlace compartido.', 'err'); return; }
      try { await downloads.save({ filename, data: blob }); setMsg('PDF descargado. Imprímalo, fírmelo y entréguelo con los documentos de soporte.', 'ok'); }
      catch (e) { const c = e && e.code; setMsg(c === 'declined' ? 'Descarga cancelada. Pulse de nuevo el botón cuando quiera guardar el PDF.' : c === 'rate_limited' ? 'Ya hay una descarga pendiente de confirmar. Espere un momento e intente otra vez.' : 'No se pudo descargar el PDF en esta vista. Intente desde otro navegador.', 'err'); }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setMsg('PDF descargado. Imprímalo, fírmelo y entréguelo con los documentos de soporte.', 'ok');
    }
  } catch (e) { console.error(e); setMsg('Ocurrió un error al generar el PDF. Recargue la página e intente de nuevo.', 'err'); }
  finally { btn.disabled = false; }
});
let armed = false, timer = null;
document.getElementById('btnClear').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!armed) { armed = true; b.textContent = 'Confirmar: borrar todo'; setMsg('Pulse otra vez para borrar todos los datos del formulario.', 'err');
    timer = setTimeout(() => { armed = false; b.textContent = 'Borrar todo'; setMsg('Complete el formulario y descargue el PDF para firmar.'); }, 4000); return; }
  clearTimeout(timer); armed = false; b.textContent = 'Borrar todo';
  frm.reset(); try { localStorage.removeItem(CFG.key); } catch(_){}
  document.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
  calc(); refresh(); setMsg('Formulario borrado.');
});
load(); calc(); refresh();
</script>
